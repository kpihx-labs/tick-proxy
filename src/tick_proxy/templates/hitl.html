<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tick-proxy — HITL</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
h1 { color: #333; }
.box { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
pre { background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto; }
.btn { padding: 0.5rem 2rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin: 0.25rem; }
.btn-approve { background: #2ecc71; color: #fff; }
.btn-reject { background: #e74c3c; color: #fff; }
textarea { width: 100%; min-height: 80px; margin: 0.5rem 0; }
label { font-weight: bold; display: block; margin: 0.5rem 0 0.25rem; }
</style></head><body>
<h1>🚀 tick-proxy — HITL Review</h1>
<p><strong>Action:</strong> {{FUNC_NAME}}</p>
<div class="box">
<label>Payload (editable):</label>
<textarea id="payload">{{PAYLOAD_JSON}}</textarea>
</div>
<div class="box">
<label>Comment (optional):</label>
<textarea id="comment" placeholder="Add a comment..."></textarea>
</div>
<div>
<button class="btn btn-approve" onclick="submit('approved')">✅ Approve</button>
<button class="btn btn-reject" onclick="submit('rejected')">❌ Reject</button>
</div>
<script>
const ORIGINAL_PAYLOAD_STR = JSON.stringify(JSON.parse('{{PAYLOAD_JSON_SAFE}}'));

async function submit(status) {
    let payload;
    const raw = document.getElementById('payload').value;
    try {
        payload = JSON.parse(raw);
    } catch (e) {
        payload = raw;
    }
    const comment = document.getElementById('comment').value;
    const edited = (JSON.stringify(JSON.parse(raw)) !== ORIGINAL_PAYLOAD_STR);
    const resp = await fetch('/submit', {
        method: 'POST',
        body: JSON.stringify({
            id: '{{REQUEST_ID}}',
            status: status,
            comment: comment,
            payload: payload,
            edited: edited
        })
    });
    if (resp.ok) {
        document.body.innerHTML = '<h2>✅ ' + status + '</h2><p>You can close this window.</p>';
    }
}
</script>
</body></html>
