[project]
name = "tick-proxy"
version = "2.1.0"
description = "TickTick administrative proxy — RPC CLI for tasks, projects, habits, tags and query views"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "httpx>=0.28.1",
    "rich>=13.9.4",
    "pydantic>=2.10.6",
]

[project.scripts]
tick-proxy = "tick_proxy.cli:app"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.9.0",
    "pyright>=1.1.300",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
